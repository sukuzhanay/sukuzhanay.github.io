name: Notify IndexNow after Pages deployment
on:
  push:
    branches: [main]
    paths: ['index.html', 'styles.css', 'topics/**', '.github/workflows/notify-indexnow.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-indexnow
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Pages, verify changed URLs and notify IndexNow
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const host = 'sukuzhanay.github.io';
          const key = '473f9de81bbba39d6f39cf674fd7de0d';
          const sha = process.env.DEPLOYED_SHA, before = process.env.BEFORE_SHA;
          if (![sha,before].every(s=>/^[0-9a-f]{40}$/.test(s))) throw new Error('Invalid commit SHA');
          const api = 'https://api.github.com/repos/sukuzhanay/sukuzhanay.github.io';
          async function get(path) {
            const r = await fetch(api+path,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`},signal:AbortSignal.timeout(15000)});
            if (!r.ok) throw new Error(`GitHub lookup: ${r.status}`);
            return r.json();
          }
          const diff = await get(`/compare/${before}...${sha}`);
          if ((diff.files?.length || 0) >= 300) throw new Error('Change set too large; review notification list');
          const paths = new Set();
          for (const file of diff.files || []) {
            if (file.status === 'removed') continue;
            if (file.filename === 'index.html') paths.add('/');
            if (/^topics\/[a-z0-9-]+\/index\.html$/.test(file.filename)) paths.add('/'+file.filename.replace(/index\.html$/,''));
            if (file.filename === 'styles.css') { paths.add('/'); paths.add('/topics/aws-data-architecture/'); }
          }
          if (!paths.size) {console.log('No changed public HTML pages; skipped.');process.exit(0);}
          let published = false;
          for (let attempt=0;attempt<36;attempt++) {
            const runs = await get(`/actions/runs?head_sha=${sha}&per_page=30`);
            const page = runs.workflow_runs.find(r=>r.path==='dynamic/pages/pages-build-deployment');
            if (page?.status==='completed') {
              if(page.conclusion!=='success') throw new Error(`Pages deployment: ${page.conclusion}`);
              published=true;break;
            }
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!published) throw new Error('Pages deployment not confirmed; no URLs submitted');
          const keyLocation = `https://${host}/${key}.txt`;
          const proof=await fetch(keyLocation,{signal:AbortSignal.timeout(15000)});
          if(!proof.ok || (await proof.text()).trim()!==key) throw new Error('Ownership key is not live');
          const urlList=[...paths].map(path=>`https://${host}${path}`);
          for(const url of urlList) {
            const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
            if(!r.ok) throw new Error(`Page unavailable: ${url} (${r.status})`);
          }
          const result=await fetch('https://api.indexnow.org/indexnow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host,key,keyLocation,urlList}),signal:AbortSignal.timeout(30000)});
          console.log(`IndexNow HTTP ${result.status}; URLs=${urlList.join(',')}; indexing is not guaranteed.`);
          if(![200,202].includes(result.status)) throw new Error(await result.text());
          JS
